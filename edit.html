<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Edit Games - Corman Soccer Stats</title>
  <style>
:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --surface-2:      #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --border:         rgba(11, 11, 11, 0.10);
  --series-ellie:   #1f8f5f;
  --series-lilly:   #2a78d6;
  --status-critical:#d03b3b;
  --status-good:    #0ca30c;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255, 255, 255, 0.10);
    --series-ellie:   #3ecf94;
    --series-lilly:   #3987e5;
    --status-critical:#e66767;
    --status-good:    #0ca30c;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --surface-2:      #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --border:         rgba(255, 255, 255, 0.10);
  --series-ellie:   #3ecf94;
  --series-lilly:   #3987e5;
  --status-critical:#e66767;
  --status-good:    #0ca30c;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--surface-2);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
}

header.top {
  margin-bottom: 16px;
  padding-top: 8px;
}

header.top h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: -0.01em;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--surface-2);
  padding: 10px 0;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--gridline);
}
.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status-msg {
  font-size: 13px;
  color: var(--text-muted);
}
.status-msg.error { color: var(--status-critical); }

.btn {
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.primary {
  background: var(--series-lilly);
  border-color: var(--series-lilly);
  color: #ffffff;
}
.btn.danger { color: var(--status-critical); }
.btn:disabled { opacity: 0.5; cursor: default; }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.section-header h2 {
  font-size: 15px;
  margin: 0;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.table-scroll { overflow-x: auto; border-radius: 12px; }

table.edit-table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 13px;
}

table.edit-table th, table.edit-table td {
  padding: 8px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid var(--gridline);
  white-space: normal;
}

table.edit-table th {
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 600;
  vertical-align: top;
}
table.edit-table th div { display: block; white-space: nowrap; }
table.edit-table th div:not(:first-child) { margin-top: 2px; }

table.edit-table td.delete-cell { width: 1%; padding-left: 2px; padding-right: 4px; text-align: center; }

table.edit-table tr.row-top td { border-bottom: none; padding-bottom: 3px; }
table.edit-table tr.row-bottom td { padding-top: 3px; }
table.edit-table tbody tr.row-bottom:last-child td { border-bottom: none; }

table.edit-table input[type="date"],
table.edit-table input[type="text"],
table.edit-table input[type="number"] {
  width: 100%;
  font-family: inherit;
  font-size: 13px;
  background: var(--surface-2);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 6px;
}

.player-radios {
  display: flex;
  gap: 4px;
  white-space: nowrap;
}
.player-radios label {
  display: flex;
  align-items: center;
  gap: 1px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.player-radios input[type="radio"] {
  margin: 0;
  width: 12px;
  height: 12px;
}
.player-radios label.Ellie { color: var(--series-ellie); }
.player-radios label.Lilly { color: var(--series-lilly); }

.score-pair, .stat-pair {
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}
table.edit-table .score-pair input, table.edit-table .stat-pair input {
  width: 24px;
  flex: none;
  text-align: center;
  padding: 5px 0;
  -moz-appearance: textfield;
}
.score-pair input::-webkit-outer-spin-button,
.score-pair input::-webkit-inner-spin-button,
.stat-pair input::-webkit-outer-spin-button,
.stat-pair input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.row-delete-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  padding: 4px 6px;
}
.row-delete-btn:hover { color: var(--status-critical); }

/* -- delete confirmation modal -- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 60;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  max-width: 320px;
  width: 100%;
}
.modal-box p { margin: 0 0 16px; font-size: 14px; }
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.empty-state {
  text-align: center;
  color: var(--text-muted);
  padding: 32px 16px;
  background: var(--surface-1);
  border: 1px dashed var(--border);
  border-radius: 12px;
  font-size: 14px;
}

/* -- password gate -- */
.gate-overlay {
  position: fixed;
  inset: 0;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 16px;
}
.gate-box {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  max-width: 320px;
  width: 100%;
}
.gate-box h2 { margin: 0 0 12px; font-size: 17px; }
.gate-box input {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text-primary);
  margin-bottom: 10px;
}
.gate-error {
  color: var(--status-critical);
  font-size: 12px;
  margin-bottom: 10px;
}
  </style>
</head>
<body>
  <div class="gate-overlay" id="gateOverlay">
    <div class="gate-box">
      <h2>Enter password</h2>
      <input type="password" id="gatePassword" autocomplete="off">
      <div class="gate-error" id="gateError" hidden>Incorrect password.</div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <a href="index.html" class="btn small">Cancel</a>
        <button class="btn primary small" id="gateUnlockBtn">Unlock</button>
      </div>
    </div>
  </div>

  <div class="app" id="editApp" hidden>
    <header class="top">
      <h1>Edit Games</h1>
    </header>

    <div class="toolbar">
      <span class="status-msg" id="statusMsg"></span>
      <div class="toolbar-actions">
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="submitBtn">Submit</button>
      </div>
    </div>

    <div class="section-header">
      <h2>Games</h2>
      <button class="btn small" id="addGameBtn">+ Add game</button>
    </div>

    <div class="table-scroll">
      <table class="edit-table" id="editTable">
        <colgroup>
          <col style="width: 30%">
          <col style="width: 42%">
          <col style="width: 20%">
          <col style="width: 8%">
        </colgroup>
        <thead>
          <tr>
            <th><div>Player</div><div>Date</div></th>
            <th><div>Team</div><div>Opponent</div></th>
            <th><div>Team GF-GA</div><div>Player G, A</div></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="editTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModalOverlay">
    <div class="modal-box">
      <p>Are you sure you want to delete this game?</p>
      <div class="modal-actions">
        <button class="btn" id="deleteCancelBtn">Cancel</button>
        <button class="btn primary" id="deleteConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <datalist id="teamSuggestions"></datalist>

  <script>
// Vercel serverless function that holds the GitHub token server-side and
// proxies the save. See api/README.md for setup.
const SAVE_ENDPOINT = "https://soccer-stats-dashboard.vercel.app/api/save-games";

// Not real security - just keeps casual visitors from poking at this page.
const EDIT_PASSWORD = "soccer118";
const EDIT_UNLOCK_KEY = "soccerEditUnlocked";

let allGames = [];
let nextRowId = 1;

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// -- date display (MM/DD/YY) <-> storage (ISO YYYY-MM-DD) --

function toMMDDYY(isoDate) {
  const [y, m, d] = isoDate.split("-");
  return `${m}/${d}/${y.slice(2)}`;
}

function fromMMDDYY(str) {
  const match = str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if (!match) return null;
  let [, m, d, y] = match;
  if (y.length === 2) y = "20" + y;
  m = m.padStart(2, "0");
  d = d.padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// Auto-inserts slashes as the user types digits, e.g. "081326" -> "08/13/26".
function formatDateAsTyped(raw) {
  const digits = raw.replace(/\D/g, "").slice(0, 6);
  return [digits.slice(0, 2), digits.slice(2, 4), digits.slice(4, 6)].filter(Boolean).join("/");
}

// -- password gate --

function unlock() {
  document.getElementById("gateOverlay").style.display = "none";
  document.getElementById("editApp").hidden = false;
  init();
}

function tryUnlockGate() {
  if (document.getElementById("gatePassword").value === EDIT_PASSWORD) {
    sessionStorage.setItem(EDIT_UNLOCK_KEY, "true");
    unlock();
  } else {
    document.getElementById("gateError").hidden = false;
  }
}

// -- row rendering --

function blankGame() {
  return {
    date: new Date().toISOString().slice(0, 10),
    team: "",
    opponent: "",
    player: "Ellie",
    goals: 0,
    assists: 0,
    teamGoalsFor: 0,
    teamGoalsAgainst: 0,
  };
}

// Each game renders as two real <tr>s sharing one data-row-id, so the
// browser's native table layout vertically centers row 1's cells (player,
// team, score) against each other, and row 2's cells (date, opponent,
// stats) against each other - matching the read-only table's field
// positions can't be done with divs stacked independently per column,
// since nothing then ties e.g. the (short) player radios to the (taller)
// team input's height.
function rowHtml(game, rowId) {
  return `
    <tr class="row-top" data-row-id="${rowId}">
      <td>
        <div class="player-radios">
          <label class="Ellie"><input type="radio" name="player-${rowId}" value="Ellie" ${game.player === "Ellie" ? "checked" : ""}> Ellie</label>
          <label class="Lilly"><input type="radio" name="player-${rowId}" value="Lilly" ${game.player === "Lilly" ? "checked" : ""}> Lilly</label>
        </div>
      </td>
      <td>
        <input type="text" class="cell-team" value="${escapeHtml(game.team)}" list="teamSuggestions" placeholder="Team">
      </td>
      <td>
        <div class="score-pair">
          <input type="number" min="0" class="cell-gf" value="${game.teamGoalsFor}">
          <span>-</span>
          <input type="number" min="0" class="cell-ga" value="${game.teamGoalsAgainst}">
        </div>
      </td>
      <td class="delete-cell" rowspan="2"><button type="button" class="row-delete-btn" title="Delete this game">&times;</button></td>
    </tr>
    <tr class="row-bottom" data-row-id="${rowId}">
      <td>
        <input type="text" inputmode="numeric" class="cell-date" placeholder="MM/DD/YY" value="${escapeHtml(toMMDDYY(game.date))}">
      </td>
      <td>
        <input type="text" class="cell-opponent" value="${escapeHtml(game.opponent)}" placeholder="Opponent">
      </td>
      <td>
        <div class="stat-pair">
          <input type="number" min="0" class="cell-goals" value="${game.goals}">
          <span>,</span>
          <input type="number" min="0" class="cell-assists" value="${game.assists}">
        </div>
      </td>
    </tr>`;
}

function renderRows(games) {
  const tbody = document.getElementById("editTableBody");
  tbody.innerHTML = games.map((g) => rowHtml(g, nextRowId++)).join("");
}

function addBlankRowAtTop() {
  const tbody = document.getElementById("editTableBody");
  const rowId = nextRowId++;
  tbody.insertAdjacentHTML("afterbegin", rowHtml(blankGame(), rowId));
  tbody.querySelector(`tr[data-row-id="${rowId}"] .cell-date`)?.focus();
  refreshTeamSuggestions();
}

const TEAM_SUGGESTION_WINDOW_DAYS = 30;

function refreshTeamSuggestions() {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - TEAM_SUGGESTION_WINDOW_DAYS);
  const teams = new Set();
  allGames.forEach((g) => {
    if (new Date(g.date) >= cutoff) teams.add(g.team);
  });
  const datalist = document.getElementById("teamSuggestions");
  datalist.innerHTML = Array.from(teams)
    .sort()
    .map((t) => `<option value="${escapeHtml(t)}">`)
    .join("");
}

// -- collect + validate --

function collectGames() {
  const rowIds = [];
  const seen = new Set();
  document.querySelectorAll("#editTableBody tr[data-row-id]").forEach((tr) => {
    const id = tr.dataset.rowId;
    if (!seen.has(id)) {
      seen.add(id);
      rowIds.push(id);
    }
  });

  const games = [];
  for (let i = 0; i < rowIds.length; i++) {
    const id = rowIds[i];
    const [topTr, bottomTr] = document.querySelectorAll(`#editTableBody tr[data-row-id="${id}"]`);
    const dateRaw = bottomTr.querySelector(".cell-date").value;
    const date = fromMMDDYY(dateRaw);
    const team = topTr.querySelector(".cell-team").value.trim();
    const opponent = bottomTr.querySelector(".cell-opponent").value.trim();
    const playerInput = topTr.querySelector("input[type=radio]:checked");
    const player = playerInput ? playerInput.value : "";

    if (!team || !opponent || !player || !dateRaw) {
      return { error: `Row ${i + 1} is missing a required field (date, team, opponent, or player).` };
    }
    if (!date) {
      return { error: `Row ${i + 1} has an invalid date - use MM/DD/YY.` };
    }

    games.push({
      date,
      team,
      opponent,
      player,
      goals: Number(bottomTr.querySelector(".cell-goals").value) || 0,
      assists: Number(bottomTr.querySelector(".cell-assists").value) || 0,
      teamGoalsFor: Number(topTr.querySelector(".cell-gf").value) || 0,
      teamGoalsAgainst: Number(topTr.querySelector(".cell-ga").value) || 0,
    });
  }
  return { games };
}

// -- save via the Worker (holds the GitHub token server-side) --

async function submitChanges() {
  const statusEl = document.getElementById("statusMsg");
  statusEl.classList.remove("error");

  const { games, error } = collectGames();
  if (error) {
    statusEl.textContent = error;
    statusEl.classList.add("error");
    return;
  }

  document.getElementById("submitBtn").disabled = true;
  statusEl.textContent = "Saving…";

  try {
    const resp = await fetch(SAVE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: EDIT_PASSWORD, games }),
    });
    const result = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(result.error || `Save failed (${resp.status}).`);

    statusEl.textContent = "Saved. Returning to dashboard…";
    window.location.href = "index.html";
  } catch (err) {
    statusEl.textContent = "Couldn't save: " + err.message + ". Your edits are still here - try again.";
    statusEl.classList.add("error");
    document.getElementById("submitBtn").disabled = false;
  }
}

// -- init --

async function init() {
  const res = await fetch("data/games.json", { cache: "no-store" });
  const data = await res.json();
  allGames = data.games || [];

  const sorted = allGames.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  renderRows(sorted);
  refreshTeamSuggestions();

  let pendingDeleteRowId = null;

  document.getElementById("editTableBody").addEventListener("click", (e) => {
    const btn = e.target.closest(".row-delete-btn");
    if (!btn) return;
    pendingDeleteRowId = btn.closest("tr").dataset.rowId;
    document.getElementById("deleteModalOverlay").classList.add("open");
  });

  document.getElementById("deleteCancelBtn").addEventListener("click", () => {
    pendingDeleteRowId = null;
    document.getElementById("deleteModalOverlay").classList.remove("open");
  });

  document.getElementById("deleteConfirmBtn").addEventListener("click", () => {
    if (pendingDeleteRowId !== null) {
      document
        .querySelectorAll(`#editTableBody tr[data-row-id="${pendingDeleteRowId}"]`)
        .forEach((tr) => tr.remove());
    }
    pendingDeleteRowId = null;
    document.getElementById("deleteModalOverlay").classList.remove("open");
  });

  document.getElementById("editTableBody").addEventListener("input", (e) => {
    if (e.target.classList.contains("cell-date")) {
      const cursorWasAtEnd = e.target.selectionStart === e.target.value.length;
      e.target.value = formatDateAsTyped(e.target.value);
      if (cursorWasAtEnd) e.target.setSelectionRange(e.target.value.length, e.target.value.length);
    }
  });

  document.getElementById("addGameBtn").addEventListener("click", addBlankRowAtTop);
  document.getElementById("submitBtn").addEventListener("click", submitChanges);
  document.getElementById("cancelBtn").addEventListener("click", () => {
    window.location.href = "index.html";
  });
}

document.addEventListener("DOMContentLoaded", () => {
  if (sessionStorage.getItem(EDIT_UNLOCK_KEY) === "true") {
    unlock();
  } else {
    document.getElementById("gateUnlockBtn").addEventListener("click", tryUnlockGate);
    document.getElementById("gatePassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryUnlockGate();
    });
    document.getElementById("gatePassword").focus();
  }
});
  </script>
</body>
</html>
