<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Edit Games - Corman Soccer Stats</title>
  <style>
:root {
  color-scheme: light;
  --surface-1:      #ffffff;
  --surface-2:      #ffffff;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --border:         rgba(11, 11, 11, 0.10);
  --series-ellie:   #99000b;
  --series-lilly:   #2a78d6;
  --status-critical:#d03b3b;
  --status-good:    #0ca30c;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255, 255, 255, 0.10);
    --series-ellie:   #f87171;
    --series-lilly:   #3987e5;
    --status-critical:#e66767;
    --status-good:    #0ca30c;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --surface-2:      #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --border:         rgba(255, 255, 255, 0.10);
  --series-ellie:   #f87171;
  --series-lilly:   #3987e5;
  --status-critical:#e66767;
  --status-good:    #0ca30c;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--surface-2);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

.app {
  max-width: 880px;
  margin: 0 auto;
  padding: 16px;
}

header.top {
  margin-bottom: 16px;
  padding-top: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

header.top h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: -0.01em;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-2);
  padding: 10px 0;
  margin-bottom: 12px;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-msg {
  font-size: 13px;
  color: var(--text-muted);
}
.status-msg.error { color: var(--status-critical); }

.btn {
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.primary {
  background: var(--text-primary);
  border-color: var(--text-primary);
  color: var(--surface-1);
}
.btn.accent {
  background: var(--gridline);
  border-color: var(--border);
  color: var(--text-primary);
}
.btn.accent:hover { filter: brightness(0.95); }
.btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.ghost:hover { background: #cccccc; }
.header-actions .btn.ghost {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn.danger { color: var(--status-critical); }
.btn:disabled { opacity: 0.5; cursor: default; }

.section {
  margin-bottom: 24px;
}

.table-scroll { overflow-x: auto; border-radius: 12px; }

table.edit-table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  background: var(--surface-1);
  font-size: 13px;
}

table.edit-table th, table.edit-table td {
  padding: 8px;
  text-align: left;
  vertical-align: middle;
  border-bottom: 1px solid var(--gridline);
  white-space: normal;
}

table.edit-table th {
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 600;
  vertical-align: top;
}
table.edit-table th div { display: block; white-space: nowrap; }
table.edit-table th div:not(:first-child) { margin-top: 2px; }

table.edit-table td.delete-cell { width: 1%; padding-left: 2px; padding-right: 4px; text-align: center; }

table.edit-table tr.row-top td { border-bottom: none; padding-bottom: 3px; }
table.edit-table tr.row-bottom td { padding-top: 3px; }
table.edit-table tbody tr.row-bottom:last-child td { border-bottom: none; }

/* The delete button's cell spans both rows of a game entry, but it's
   written inside the row-top <tr>, so the row-top rule above (which
   suppresses the divider between a pair's own two rows) was also
   suppressing its bottom border - the one divider that's actually
   supposed to separate one game entry from the next. Restoring it here
   (and re-suppressing it only for the last entry, to match every other
   column not drawing a line below the last row) makes it span the full
   row width like every other column's divider. */
table.edit-table tr.row-top td.delete-cell { border-bottom: 1px solid var(--gridline); }
table.edit-table tr.row-top:has(+ tr.row-bottom:last-child) td.delete-cell { border-bottom: none; }

table.edit-table input[type="text"],
table.edit-table input[type="number"] {
  width: 100%;
  font-family: inherit;
  font-size: 13px;
  background: #f5f5f5;
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 6px;
}

/* A native date input (for its calendar picker) sits invisibly on top of a
   plain text display showing the MM/DD/YY value - clicking/tapping the box
   opens the native picker, but the visible text is always our own
   controlled format rather than whatever the OS locale would show. */
table.edit-table .date-picker-field {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  font-size: 13px;
  background: #f5f5f5;
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0;
  overflow: hidden;
}
table.edit-table .date-picker-field .cell-date-display {
  padding: 5px 6px;
  width: 100%;
  pointer-events: none;
  white-space: nowrap;
}
table.edit-table .date-picker-field input[type="date"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: none;
  opacity: 0;
  cursor: pointer;
}

table.edit-table input:disabled {
  background: #cccccc;
  color: var(--text-muted);
  cursor: not-allowed;
}

.player-radios {
  display: flex;
  gap: 9px;
  white-space: nowrap;
}
.player-radios label {
  display: flex;
  align-items: center;
  gap: 1px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.player-radios input[type="radio"] {
  margin: 0;
  width: 12px;
  height: 12px;
  accent-color: var(--text-primary);
}
.player-radios label.Ellie { color: var(--series-ellie); }
.player-radios label.Lilly { color: var(--series-lilly); }

/* A CSS Grid with explicit, fixed-width tracks (rather than flexbox with
   a gap) keeps GF-GA and G-A tight and compact - not stretched across
   the whole column - while each column's width stays locked regardless
   of the separator glyph's own rendered width ("-" vs ","), which is
   what was pushing GA out of alignment with A. Flexbox's gap property
   in particular has a history of small cross-browser/iOS Safari
   rendering inconsistencies that this sidesteps entirely. */
.score-pair, .stat-pair {
  display: inline-grid;
  grid-template-columns: 24px 8px 24px;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}
.score-pair span, .stat-pair span {
  text-align: center;
}
table.edit-table .score-pair input, table.edit-table .stat-pair input {
  width: 100%;
  text-align: center;
  padding: 5px 0;
  -moz-appearance: textfield;
}
.score-pair input::-webkit-outer-spin-button,
.score-pair input::-webkit-inner-spin-button,
.stat-pair input::-webkit-outer-spin-button,
.stat-pair input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.row-delete-btn {
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  padding: 4px 6px;
}
.row-delete-btn:hover { color: var(--status-critical); }

/* -- delete confirmation modal -- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 60;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  max-width: 320px;
  width: 100%;
}
.modal-box p { margin: 0 0 16px; font-size: 14px; }
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.empty-state {
  text-align: center;
  color: var(--text-muted);
  padding: 32px 16px;
  background: var(--surface-1);
  border: 1px dashed var(--border);
  border-radius: 12px;
  font-size: 14px;
}

/* -- password gate -- */
.gate-overlay {
  position: fixed;
  inset: 0;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 16px;
}
.gate-box {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  max-width: 320px;
  width: 100%;
}
.gate-box h2 { margin: 0 0 12px; font-size: 17px; }
.gate-box input {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text-primary);
  margin-bottom: 10px;
}
.gate-error {
  color: var(--status-critical);
  font-size: 12px;
  margin-bottom: 10px;
}
  </style>
</head>
<body>
  <div class="gate-overlay" id="gateOverlay">
    <div class="gate-box">
      <h2>Enter password</h2>
      <input type="password" id="gatePassword" autocomplete="off">
      <div class="gate-error" id="gateError" hidden>Incorrect password.</div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <a href="index.html" class="btn small">Cancel</a>
        <button class="btn primary small" id="gateUnlockBtn">Unlock</button>
      </div>
    </div>
  </div>

  <div class="app" id="editApp" hidden>
    <header class="top">
      <h1>Edit</h1>
      <div class="header-actions">
        <button class="btn ghost" id="addGameBtn">
          <svg class="btn-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add game
        </button>
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="submitBtn">Submit</button>
      </div>
    </header>

    <div class="toolbar">
      <span class="status-msg" id="statusMsg"></span>
    </div>

    <div class="section">
      <div class="table-scroll">
        <table class="edit-table" id="editTable">
          <colgroup>
            <col style="width: 33%">
            <col style="width: 39%">
            <col style="width: 20%">
            <col style="width: 8%">
          </colgroup>
          <thead>
            <tr>
              <th><div>Player</div><div>Date</div></th>
              <th><div>Team</div><div>Opponent</div></th>
              <th><div>Team GF-GA</div><div>Player G, A</div></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="editTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModalOverlay">
    <div class="modal-box">
      <p>Are you sure you want to delete this game?</p>
      <div class="modal-actions">
        <button class="btn" id="deleteCancelBtn">Cancel</button>
        <button class="btn primary" id="deleteConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>

  <datalist id="teamSuggestions"></datalist>

  <script>
// Vercel serverless functions that hold the GitHub token server-side and
// proxy reads/saves through the live GitHub API. See api/README.md.
const SAVE_ENDPOINT = "https://soccer-stats-dashboard.vercel.app/api/save-games";
const GET_GAMES_ENDPOINT = "https://soccer-stats-dashboard.vercel.app/api/get-games";

// Even the live GitHub API read is still an extra network round trip a
// save-then-immediately-reload has to wait on. Since a successful save
// already hands us the exact resulting array, stash it here and prefer it
// over a fetch for a little while, so an editor's own save is reflected
// with zero extra latency. A stale tab left open falls back to a real
// fetch once the stash expires, so it still picks up changes made
// elsewhere.
const RECENT_SAVE_KEY = "soccerRecentSaveV1";
const RECENT_SAVE_TTL_MS = 10 * 60 * 1000;

function readRecentSave() {
  try {
    const raw = sessionStorage.getItem(RECENT_SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.games) || Date.now() - parsed.savedAt > RECENT_SAVE_TTL_MS) return null;
    return parsed.games;
  } catch {
    return null;
  }
}

function writeRecentSave(games) {
  try {
    sessionStorage.setItem(RECENT_SAVE_KEY, JSON.stringify({ games, savedAt: Date.now() }));
  } catch {
    // Best-effort only - sessionStorage can throw (private browsing, full
    // storage); the network fetch is still the fallback source of truth.
  }
}

// Not real security - just keeps casual visitors from poking at this page.
const EDIT_PASSWORD = "soccer118";
const EDIT_UNLOCK_KEY = "soccerEditUnlocked";

let allGames = [];
let nextRowId = 1;

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// -- date display (MM/DD/YY) <-> storage (ISO YYYY-MM-DD) --

function toMMDDYY(isoDate) {
  const [y, m, d] = isoDate.split("-");
  return `${m}/${d}/${y.slice(2)}`;
}

// "Today" is always the current calendar date in US Eastern time, regardless
// of the device's own timezone - handles the EST/EDT switch automatically.
function todayEasternISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
}

function isFutureDate(isoDateStr) {
  return isoDateStr > todayEasternISO();
}

// -- password gate --

function unlock() {
  document.getElementById("gateOverlay").style.display = "none";
  document.getElementById("editApp").hidden = false;
  init();
}

function tryUnlockGate() {
  if (document.getElementById("gatePassword").value === EDIT_PASSWORD) {
    sessionStorage.setItem(EDIT_UNLOCK_KEY, "true");
    unlock();
  } else {
    document.getElementById("gateError").hidden = false;
  }
}

// -- row rendering --

function blankGame() {
  return {
    date: todayEasternISO(),
    team: "",
    opponent: "",
    player: "",
    goals: null,
    assists: null,
    teamGoalsFor: null,
    teamGoalsAgainst: null,
  };
}

// Each game renders as two real <tr>s sharing one data-row-id, so the
// browser's native table layout vertically centers row 1's cells (player,
// team, score) against each other, and row 2's cells (date, opponent,
// stats) against each other - matching the read-only table's field
// positions can't be done with divs stacked independently per column,
// since nothing then ties e.g. the (short) player radios to the (taller)
// team input's height.
function rowHtml(game, rowId) {
  // Goals/assists always default to 0 in stored data (never null, unlike
  // GF/GA), but showing that "0" for a game that hasn't been played yet
  // reads like a recorded stat rather than "no data yet" - blank it out
  // for display the same way an unset GF/GA already renders blank.
  const gameIsFuture = isFutureDate(game.date);
  return `
    <tr class="row-top" data-row-id="${rowId}">
      <td>
        <div class="player-radios">
          <label class="Ellie"><input type="radio" name="player-${rowId}" value="Ellie" ${game.player === "Ellie" ? "checked" : ""}> Ellie</label>
          <label class="Lilly"><input type="radio" name="player-${rowId}" value="Lilly" ${game.player === "Lilly" ? "checked" : ""}> Lilly</label>
        </div>
      </td>
      <td>
        <input type="text" class="cell-team" value="${escapeHtml(game.team)}" list="teamSuggestions">
      </td>
      <td>
        <div class="score-pair">
          <input type="number" min="0" class="cell-gf" value="${game.teamGoalsFor ?? ""}">
          <span>-</span>
          <input type="number" min="0" class="cell-ga" value="${game.teamGoalsAgainst ?? ""}">
        </div>
      </td>
      <td class="delete-cell" rowspan="2"><button type="button" class="row-delete-btn" title="Delete this game">&times;</button></td>
    </tr>
    <tr class="row-bottom" data-row-id="${rowId}">
      <td>
        <div class="date-picker-field">
          <span class="cell-date-display">${escapeHtml(toMMDDYY(game.date))}</span>
          <input type="date" class="cell-date" value="${escapeHtml(game.date || "")}">
        </div>
      </td>
      <td>
        <input type="text" class="cell-opponent" value="${escapeHtml(game.opponent)}">
      </td>
      <td>
        <div class="stat-pair">
          <input type="number" min="0" class="cell-goals" value="${gameIsFuture || game.goals == null ? "" : game.goals}">
          <span>,</span>
          <input type="number" min="0" class="cell-assists" value="${gameIsFuture || game.assists == null ? "" : game.assists}">
        </div>
      </td>
    </tr>`;
}

// Future games haven't been played yet, so their score fields are greyed
// out and blocked from entry until the date arrives.
function updateScoreFieldsDisabled(rowId) {
  const topTr = document.querySelector(`#editTableBody tr[data-row-id="${rowId}"].row-top`);
  const bottomTr = document.querySelector(`#editTableBody tr[data-row-id="${rowId}"].row-bottom`);
  if (!topTr || !bottomTr) return;
  const date = bottomTr.querySelector(".cell-date").value; // native date input - always ISO
  const future = date ? isFutureDate(date) : false;
  topTr.querySelector(".cell-gf").disabled = future;
  topTr.querySelector(".cell-ga").disabled = future;
  bottomTr.querySelector(".cell-goals").disabled = future;
  bottomTr.querySelector(".cell-assists").disabled = future;
}

function renderRows(games) {
  const tbody = document.getElementById("editTableBody");
  const rowIds = games.map(() => nextRowId++);
  tbody.innerHTML = games.map((g, i) => rowHtml(g, rowIds[i])).join("");
  rowIds.forEach((id) => updateScoreFieldsDisabled(id));
}

function addBlankRowAtTop() {
  const tbody = document.getElementById("editTableBody");
  const rowId = nextRowId++;
  tbody.insertAdjacentHTML("afterbegin", rowHtml(blankGame(), rowId));
  updateScoreFieldsDisabled(rowId);
  tbody.querySelector(`tr[data-row-id="${rowId}"] .cell-date`)?.focus();
  refreshTeamSuggestions();
}

const TEAM_SUGGESTION_WINDOW_DAYS = 30;

function refreshTeamSuggestions() {
  // Normalize "today" to a date-only value first so the window is a clean
  // +/-30 whole-day range, unaffected by what time of day it happens to be
  // (game dates always parse as midnight UTC, so comparing against "now"
  // directly would skew the boundary by up to a day).
  const todayOnly = new Date(todayEasternISO());
  const lowerCutoff = new Date(todayOnly);
  lowerCutoff.setDate(lowerCutoff.getDate() - TEAM_SUGGESTION_WINDOW_DAYS);
  const upperCutoff = new Date(todayOnly);
  upperCutoff.setDate(upperCutoff.getDate() + TEAM_SUGGESTION_WINDOW_DAYS);
  const teams = new Set();
  allGames.forEach((g) => {
    const d = new Date(g.date);
    if (d >= lowerCutoff && d <= upperCutoff) teams.add(g.team);
  });
  const datalist = document.getElementById("teamSuggestions");
  datalist.innerHTML = Array.from(teams)
    .sort()
    .map((t) => `<option value="${escapeHtml(t)}">`)
    .join("");
}

// -- collect + validate --

// Blank means "no score entered yet" (e.g. a future game placeholder) and
// is preserved as null rather than coerced to 0, so it can be excluded from
// summary stats - distinct from an actual 0-0 result.
function parseOptionalScore(input) {
  const raw = input.value.trim();
  return raw === "" ? null : Number(raw) || 0;
}

function collectGames() {
  const rowIds = [];
  const seen = new Set();
  document.querySelectorAll("#editTableBody tr[data-row-id]").forEach((tr) => {
    const id = tr.dataset.rowId;
    if (!seen.has(id)) {
      seen.add(id);
      rowIds.push(id);
    }
  });

  const games = [];
  for (let i = 0; i < rowIds.length; i++) {
    const id = rowIds[i];
    const [topTr, bottomTr] = document.querySelectorAll(`#editTableBody tr[data-row-id="${id}"]`);
    const date = bottomTr.querySelector(".cell-date").value; // native date input - always ISO
    const team = topTr.querySelector(".cell-team").value.trim();
    const opponent = bottomTr.querySelector(".cell-opponent").value.trim();
    const playerInput = topTr.querySelector("input[type=radio]:checked");
    const player = playerInput ? playerInput.value : "";

    if (!team || !opponent || !player || !date) {
      return { error: `Row ${i + 1} is missing a required field (date, team, opponent, or player).` };
    }

    games.push({
      date,
      team,
      opponent,
      player,
      goals: Number(bottomTr.querySelector(".cell-goals").value) || 0,
      assists: Number(bottomTr.querySelector(".cell-assists").value) || 0,
      teamGoalsFor: parseOptionalScore(topTr.querySelector(".cell-gf")),
      teamGoalsAgainst: parseOptionalScore(topTr.querySelector(".cell-ga")),
    });
  }
  return { games };
}

// -- save via the Worker (holds the GitHub token server-side) --

async function submitChanges() {
  const statusEl = document.getElementById("statusMsg");
  statusEl.classList.remove("error");

  const { games, error } = collectGames();
  if (error) {
    statusEl.textContent = error;
    statusEl.classList.add("error");
    return;
  }

  document.getElementById("submitBtn").disabled = true;
  statusEl.textContent = "Saving…";

  try {
    const resp = await fetch(SAVE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: EDIT_PASSWORD, games }),
    });
    const result = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(result.error || `Save failed (${resp.status}).`);

    writeRecentSave(games);
    statusEl.textContent = "Saved. Returning to dashboard…";
    window.location.href = "index.html";
  } catch (err) {
    statusEl.textContent = "Couldn't save: " + err.message + ". Your edits are still here - try again.";
    statusEl.classList.add("error");
    document.getElementById("submitBtn").disabled = false;
  }
}

// -- init --

// Both the relative path (via GitHub Pages) and raw.githubusercontent.com
// sit behind caching/propagation layers that don't reliably line up with
// when a save actually lands - GET_GAMES_ENDPOINT instead asks the GitHub
// API directly for the file's current content, the same live call
// save-games.js already uses to check the file's sha before every save.
async function init() {
  const recent = readRecentSave();
  if (recent) {
    allGames = recent;
  } else {
    const res = await fetch(`${GET_GAMES_ENDPOINT}?_=${Date.now()}`, { cache: "no-store" });
    const data = await res.json();
    allGames = data.games || [];
  }

  const sorted = allGames.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  renderRows(sorted);
  refreshTeamSuggestions();

  let pendingDeleteRowId = null;

  document.getElementById("editTableBody").addEventListener("click", (e) => {
    const btn = e.target.closest(".row-delete-btn");
    if (btn) {
      pendingDeleteRowId = btn.closest("tr").dataset.rowId;
      document.getElementById("deleteModalOverlay").classList.add("open");
      return;
    }
    // Mobile Safari/Chrome open the native date picker on any tap, since
    // the invisible input covers the whole styled box - desktop Chrome/
    // Edge/Firefox only do that for a click on the tiny calendar-icon
    // glyph, so a click anywhere else on the box looked like nothing
    // happened. showPicker() opens it unconditionally on browsers that
    // support it; unsupported browsers just keep click-to-focus.
    if (e.target.classList.contains("cell-date") && typeof e.target.showPicker === "function") {
      try {
        e.target.showPicker();
      } catch {
        // Can throw (e.g. InvalidStateError) in some edge cases - falling
        // back to the default click-to-focus behavior is fine.
      }
    }
  });

  document.getElementById("deleteCancelBtn").addEventListener("click", () => {
    pendingDeleteRowId = null;
    document.getElementById("deleteModalOverlay").classList.remove("open");
  });

  document.getElementById("deleteConfirmBtn").addEventListener("click", () => {
    if (pendingDeleteRowId !== null) {
      document
        .querySelectorAll(`#editTableBody tr[data-row-id="${pendingDeleteRowId}"]`)
        .forEach((tr) => tr.remove());
    }
    pendingDeleteRowId = null;
    document.getElementById("deleteModalOverlay").classList.remove("open");
  });

  document.getElementById("editTableBody").addEventListener("input", (e) => {
    if (e.target.classList.contains("cell-date")) {
      const display = e.target.closest(".date-picker-field").querySelector(".cell-date-display");
      display.textContent = e.target.value ? toMMDDYY(e.target.value) : "";
      updateScoreFieldsDisabled(e.target.closest("tr").dataset.rowId);
    }
  });

  document.getElementById("addGameBtn").addEventListener("click", addBlankRowAtTop);
  document.getElementById("submitBtn").addEventListener("click", submitChanges);
  document.getElementById("cancelBtn").addEventListener("click", () => {
    window.location.href = "index.html";
  });
}

document.addEventListener("DOMContentLoaded", () => {
  if (sessionStorage.getItem(EDIT_UNLOCK_KEY) === "true") {
    unlock();
  } else {
    document.getElementById("gateUnlockBtn").addEventListener("click", tryUnlockGate);
    document.getElementById("gatePassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryUnlockGate();
    });
    document.getElementById("gatePassword").focus();
  }
});

// Using the browser's own back button to return here (rather than the
// Cancel link) can restore this page from the back-forward cache instead
// of loading it fresh - a frozen snapshot of the DOM exactly as it was
// before submitting, with none of this script re-running, so the row
// values shown are whatever they were pre-submit. Forcing a real reload
// when that happens makes init() run again and pick up the just-saved data.
window.addEventListener("pageshow", (e) => {
  if (e.persisted) window.location.reload();
});
  </script>
</body>
</html>
