<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Corman Soccer Stats</title>
  <style>
:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --surface-2:      #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --border:         rgba(11, 11, 11, 0.10);
  --series-ellie:   #1f8f5f;
  --series-lilly:   #2a78d6;
  --series-both:    #6b6a64;
  --status-good:    #0ca30c;
  --status-critical:#d03b3b;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255, 255, 255, 0.10);
    --series-ellie:   #3ecf94;
    --series-lilly:   #3987e5;
    --series-both:    #8a8980;
    --status-good:    #0ca30c;
    --status-critical:#e66767;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --surface-2:      #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --border:         rgba(255, 255, 255, 0.10);
  --series-ellie:   #e05a5a;
  --series-lilly:   #3987e5;
  --series-both:    #8a8980;
  --status-good:    #0ca30c;
  --status-critical:#e66767;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--surface-2);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}

.app {
  max-width: 880px;
  margin: 0 auto;
  padding: 16px;
}

header.top {
  margin-bottom: 16px;
  padding-top: 8px;
}

header.top h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: -0.01em;
}

header.top .sub {
  font-size: 13px;
  color: var(--text-muted);
}

.games-filters {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.player-tabs {
  display: inline-flex;
  gap: 4px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
}

.player-tabs button {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.player-tabs button.active {
  background: var(--surface-2);
  color: var(--text-primary);
  box-shadow: 0 0 0 1px var(--border);
}

.player-tabs button[data-player="Ellie"].active { color: var(--series-ellie); }
.player-tabs button[data-player="Lilly"].active { color: var(--series-lilly); }

.section {
  margin-bottom: 24px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}

.section-header h2 {
  font-size: 15px;
  margin: 0;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.btn {
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.btn.small {
  padding: 4px 9px;
  font-size: 12px;
}

select {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  background: var(--surface-1);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  font-size: 13px;
}

table.data-table th, table.data-table td {
  padding: 9px 10px;
  text-align: right;
  border-bottom: 1px solid var(--gridline);
  white-space: nowrap;
}

table.data-table th:first-child, table.data-table td:first-child {
  text-align: left;
}

table.data-table th {
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 600;
}

table.data-table tr:last-child td { border-bottom: none; }

table.data-table tbody tr:hover { background: var(--surface-2); }

.table-scroll { overflow-x: auto; border-radius: 12px; }

table.summary-table td.player-cell {
  text-align: center;
  font-weight: 700;
  background: var(--surface-2);
  border-left: 4px solid transparent;
}
table.summary-table td.player-cell.player-Ellie { color: var(--series-ellie); border-left-color: var(--series-ellie); }
table.summary-table td.player-cell.player-Lilly { color: var(--series-lilly); border-left-color: var(--series-lilly); }
table.summary-table td.player-cell.player-Both { color: var(--series-both); border-left-color: var(--series-both); }

table.summary-table td.season-cell {
  text-align: center;
  color: var(--text-secondary);
  font-weight: 600;
  background: var(--surface-2);
}

table.summary-table td.team-cell, table.summary-table th.team-cell {
  text-align: left;
}

table.summary-table tr.all-row td {
  font-weight: 700;
}
table.summary-table tr.all-row.player-Ellie td:not(.player-cell):not(.season-cell) { background: color-mix(in srgb, var(--series-ellie) 8%, var(--surface-1)); }
table.summary-table tr.all-row.player-Lilly td:not(.player-cell):not(.season-cell) { background: color-mix(in srgb, var(--series-lilly) 8%, var(--surface-1)); }
table.summary-table tr.all-row.player-Both td:not(.player-cell):not(.season-cell) { background: color-mix(in srgb, var(--series-both) 10%, var(--surface-1)); }

.player-name.player-Ellie { color: var(--series-ellie); }
.player-name.player-Lilly { color: var(--series-lilly); }

table.stacked-table th, table.stacked-table td {
  text-align: left;
  white-space: normal;
  vertical-align: top;
}

table.stacked-table th div {
  display: block;
}
table.stacked-table th div:not(:first-child) {
  margin-top: 2px;
}

table.stacked-table td .player-name {
  font-weight: 700;
}
table.stacked-table td div:not(:first-child) {
  margin-top: 2px;
}

.empty-state {
  text-align: center;
  color: var(--text-muted);
  padding: 32px 16px;
  background: var(--surface-1);
  border: 1px dashed var(--border);
  border-radius: 12px;
  font-size: 14px;
}

table.data-table td.empty-cell {
  text-align: center;
  color: var(--text-muted);
  padding: 24px 16px;
  white-space: normal;
}

.sync-note {
  font-size: 12px;
  color: var(--text-muted);
}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Corman Soccer Stats</h1>
    </header>

    <div class="section">
      <div class="section-header">
        <h2>Summary</h2>
      </div>
      <div class="table-scroll">
        <table class="data-table summary-table" id="summaryTable"></table>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Games</h2>
      </div>
      <div class="games-filters">
        <div class="player-tabs">
          <button data-player="Both" class="active">Both</button>
          <button data-player="Ellie">Ellie</button>
          <button data-player="Lilly">Lilly</button>
        </div>
        <select id="seasonFilter"><option value="">All seasons</option></select>
        <select id="teamFilter"><option value="">All teams</option></select>
      </div>
      <div class="table-scroll">
        <table class="data-table stacked-table" id="gamesTable"></table>
      </div>
    </div>
  </div>

  <script>
const PLAYERS = ["Ellie", "Lilly"];

let allGames = [];
let filters = { player: "Both", season: "", team: "" }; // Games list only; the Summary table is fixed.

function fmtDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${m}/${d}/${y.slice(2)}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// Maps a raw season label (e.g. "Fall 2025", "Winter 25-26", "Spring 2026")
// to the full soccer-year bucket it belongs to (e.g. "2025-26"). Winter spans
// a calendar-year boundary and Spring/Summer follow the Fall that started the
// same soccer year, so both anchor to the Fall's year.
function seasonYearOf(season) {
  if (!season) return "Unknown";
  const years = (season.match(/\d{2,4}/g) || []).map((y) =>
    y.length === 2 ? 2000 + parseInt(y, 10) : parseInt(y, 10)
  );
  if (years.length === 0) return season;
  const lower = season.toLowerCase();
  let anchor;
  if (lower.includes("winter")) anchor = Math.min(...years);
  else if (lower.includes("spring") || lower.includes("summer")) anchor = years[0] - 1;
  else anchor = years[0]; // Fall, or anything unrecognized
  return `${anchor}-${String((anchor + 1) % 100).padStart(2, "0")}`;
}

function uniqueGameKey(g) {
  return `${g.date}|${g.team}|${g.opponent}`;
}

// Sums goals/assists directly (each row belongs to one player), but dedupes
// by the underlying game for match-count and team goals for/against so a
// shared game (both girls played) isn't double-counted when combined.
function computeStats(entries) {
  const G = entries.reduce((s, e) => s + e.goals, 0);
  const A = entries.reduce((s, e) => s + e.assists, 0);
  const seen = new Map();
  for (const e of entries) {
    const k = uniqueGameKey(e);
    if (!seen.has(k)) seen.set(k, e);
  }
  const uniqueGames = [...seen.values()];
  const MP = uniqueGames.length;
  const GF = uniqueGames.reduce((s, e) => s + e.teamGoalsFor, 0);
  const GA = uniqueGames.reduce((s, e) => s + e.teamGoalsAgainst, 0);
  return {
    MP,
    G,
    A,
    GF,
    GA,
    goalsPerGame: MP ? G / MP : 0,
    assistsPerGame: MP ? A / MP : 0,
    pctOfGF: GF ? G / GF : 0,
  };
}

function allSeasonYears() {
  return Array.from(new Set(allGames.map((g) => seasonYearOf(g.season)))).sort().reverse();
}

// The Summary table only ever shows this full soccer-year and later (older
// history is still browsable in the Games list below). Rolls over in August,
// so a year from now this becomes 2026, keeping the table on the current and
// prior full year automatically.
const EARLIEST_SUMMARY_YEAR = 2025;

function currentSeasonYear() {
  const now = new Date();
  const anchor = now.getMonth() + 1 >= 8 ? now.getFullYear() : now.getFullYear() - 1;
  return `${anchor}-${String((anchor + 1) % 100).padStart(2, "0")}`;
}

function render() {
  renderSummaryTable();
  renderGames();
}

// Builds the fixed Player > Season(full year) > Team hierarchy: each player's
// most recent full season-year first, an "All" subtotal per season-year, then
// each team they played on that year (A-Z). "Both" only gets "All" rows,
// combining the girls without double-counting shared games (see computeStats).
function buildSummaryRows() {
  const dataSeasonYears = allSeasonYears().filter(
    (sy) => parseInt(sy, 10) >= EARLIEST_SUMMARY_YEAR
  );
  const seasonYears = Array.from(new Set([currentSeasonYear(), ...dataSeasonYears]))
    .sort()
    .reverse();

  const rows = [];
  for (const player of ["Ellie", "Lilly", "Both"]) {
    const playerGames = player === "Both" ? allGames : allGames.filter((g) => g.player === player);

    for (const sy of seasonYears) {
      const syGames = playerGames.filter((g) => seasonYearOf(g.season) === sy);
      if (syGames.length === 0 && sy !== currentSeasonYear()) continue;

      rows.push({ player, seasonYear: sy, team: "All", stats: computeStats(syGames), isAllRow: true });

      if (player === "Both") continue; // no per-team breakdown for the combined view

      const teams = Array.from(new Set(syGames.map((g) => g.team))).sort();
      for (const team of teams) {
        const teamGames = syGames.filter((g) => g.team === team);
        rows.push({ player, seasonYear: sy, team, stats: computeStats(teamGames), isAllRow: false });
      }
    }
  }
  return rows;
}

function renderSummaryTable() {
  const table = document.getElementById("summaryTable");
  const rows = buildSummaryRows();

  const bodyRows = rows
    .map((r, i) => {
      const prev = rows[i - 1];
      const playerSpan = !prev || prev.player !== r.player
        ? rows.filter((x) => x.player === r.player).length
        : 0;
      const seasonSpan = !prev || prev.player !== r.player || prev.seasonYear !== r.seasonYear
        ? rows.filter((x) => x.player === r.player && x.seasonYear === r.seasonYear).length
        : 0;

      const playerCell = playerSpan
        ? `<td class="player-cell player-${r.player}" rowspan="${playerSpan}">${escapeHtml(r.player)}</td>`
        : "";
      const seasonCell = seasonSpan
        ? `<td class="season-cell" rowspan="${seasonSpan}">${escapeHtml(r.seasonYear)}</td>`
        : "";

      return `
        <tr class="player-${r.player} ${r.isAllRow ? "all-row" : ""}">
          ${playerCell}
          ${seasonCell}
          <td class="team-cell">${escapeHtml(r.team)}</td>
          <td>${r.stats.MP}</td>
          <td>${r.stats.GF}-${r.stats.GA}</td>
          <td>${r.stats.G}</td>
          <td>${r.stats.goalsPerGame.toFixed(2)}</td>
          <td>${(r.stats.pctOfGF * 100).toFixed(0)}%</td>
          <td>${r.stats.A}</td>
          <td>${r.stats.assistsPerGame.toFixed(2)}</td>
        </tr>`;
    })
    .join("");

  table.innerHTML = `
    <thead>
      <tr>
        <th>Player</th><th>Season</th><th class="team-cell">Team</th><th>Games</th><th>Team GF-GA</th>
        <th>Goals</th><th>Goals/Game</th><th>% of Team GF</th><th>Assists</th><th>Assists/Game</th>
      </tr>
    </thead>
    <tbody>${bodyRows}</tbody>`;
}

function outcomeLetter(gf, ga) {
  if (gf > ga) return "W";
  if (gf < ga) return "L";
  return "T";
}

function populateGameFilters() {
  const seasonSelect = document.getElementById("seasonFilter");
  const teamSelect = document.getElementById("teamFilter");

  const seasons = Array.from(new Set(allGames.map((g) => g.season))).sort().reverse();
  seasonSelect.innerHTML =
    `<option value="">All seasons</option>` +
    seasons.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");

  const teams = Array.from(new Set(allGames.map((g) => g.team))).sort();
  teamSelect.innerHTML =
    `<option value="">All teams</option>` +
    teams.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
}

function renderGames() {
  const table = document.getElementById("gamesTable");
  const players = filters.player === "Both" ? PLAYERS : [filters.player];

  const rows = allGames
    .filter((g) => players.includes(g.player))
    .filter((g) => !filters.season || g.season === filters.season)
    .filter((g) => !filters.team || g.team === filters.team)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  const bodyHtml =
    rows.length === 0
      ? `<tr><td class="empty-cell" colspan="3">No games logged yet for this filter.</td></tr>`
      : rows
          .map(
            (g) => `
        <tr>
          <td>
            <div class="player-name player-${g.player}">${escapeHtml(g.player)}</div>
            <div>${escapeHtml(g.season)}</div>
            <div>${fmtDate(g.date)}</div>
          </td>
          <td>
            <div>${escapeHtml(g.team)}</div>
            <div>v. ${escapeHtml(g.opponent)}</div>
            <div>${g.teamGoalsFor}-${g.teamGoalsAgainst} (${outcomeLetter(g.teamGoalsFor, g.teamGoalsAgainst)})</div>
          </td>
          <td>
            <div>${g.goals} G</div>
            <div>${g.assists} A</div>
          </td>
        </tr>`
          )
          .join("");

  table.innerHTML = `
    <thead>
      <tr>
        <th><div>Player</div><div>Season</div><div>Date</div></th>
        <th><div>Team</div><div>Opponent</div><div>Team GF-GA</div></th>
        <th><div>Goals</div><div>Assists</div></th>
      </tr>
    </thead>
    <tbody>${bodyHtml}</tbody>`;
}

async function loadData() {
  const res = await fetch("data/games.json", { cache: "no-store" });
  const data = await res.json();
  allGames = data.games || [];
}

document.addEventListener("DOMContentLoaded", async () => {
  document.querySelectorAll(".player-tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      filters.player = btn.dataset.player;
      document.querySelectorAll(".player-tabs button").forEach((b) => b.classList.toggle("active", b === btn));
      renderGames();
    });
  });

  document.getElementById("seasonFilter").addEventListener("change", (e) => {
    filters.season = e.target.value;
    renderGames();
  });

  document.getElementById("teamFilter").addEventListener("change", (e) => {
    filters.team = e.target.value;
    renderGames();
  });

  await loadData();
  populateGameFilters();
  render();
});
  </script>
</body>
</html>
