<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Goal Tracker</title>
  <style>
:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --surface-2:      #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --border:         rgba(11, 11, 11, 0.10);
  --series-ellie:   #2a78d6;
  --series-lilly:   #eb6834;
  --status-good:    #0ca30c;
  --status-critical:#d03b3b;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255, 255, 255, 0.10);
    --series-ellie:   #3987e5;
    --series-lilly:   #d95926;
    --status-good:    #0ca30c;
    --status-critical:#e66767;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --surface-2:      #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --border:         rgba(255, 255, 255, 0.10);
  --series-ellie:   #3987e5;
  --series-lilly:   #d95926;
  --status-good:    #0ca30c;
  --status-critical:#e66767;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--surface-2);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}

.app {
  max-width: 880px;
  margin: 0 auto;
  padding: 16px;
}

header.top {
  margin-bottom: 16px;
  padding-top: 8px;
}

header.top h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: -0.01em;
}

header.top .sub {
  font-size: 13px;
  color: var(--text-muted);
}

.player-tabs {
  display: inline-flex;
  gap: 4px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 16px;
}

.player-tabs button {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.player-tabs button.active {
  background: var(--surface-2);
  color: var(--text-primary);
  box-shadow: 0 0 0 1px var(--border);
}

.player-tabs button[data-player="Ellie"].active { color: var(--series-ellie); }
.player-tabs button[data-player="Lilly"].active { color: var(--series-lilly); }

.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

@media (max-width: 480px) {
  .stat-grid { grid-template-columns: 1fr; }
}

.stat-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  border-left: 4px solid var(--accent, var(--gridline));
}

.stat-card .player-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent, var(--text-secondary));
  margin-bottom: 8px;
}

.stat-card .metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.metric .value {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: proportional-nums;
  line-height: 1.1;
}

.metric .label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.section {
  margin-bottom: 24px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}

.section-header h2 {
  font-size: 15px;
  margin: 0;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.btn {
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.btn.small {
  padding: 4px 9px;
  font-size: 12px;
}

select {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  background: var(--surface-1);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
}

.pivot-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 12px;
  padding: 12px;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.pivot-controls .control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.pivot-controls label.group-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 600;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 420px;
}

.chip {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
}

.chip.active {
  background: var(--series-ellie);
  border-color: var(--series-ellie);
  color: #fff;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  font-size: 13px;
}

table.data-table th, table.data-table td {
  padding: 9px 10px;
  text-align: right;
  border-bottom: 1px solid var(--gridline);
  white-space: nowrap;
}

table.data-table th:first-child, table.data-table td:first-child {
  text-align: left;
}

table.data-table th {
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 600;
}

table.data-table tr:last-child td { border-bottom: none; }

table.data-table tbody tr:hover { background: var(--surface-2); }

.table-scroll { overflow-x: auto; border-radius: 12px; }

.game-card-list { display: flex; flex-direction: column; gap: 8px; }

.game-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
}

.game-card .row1 {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
  gap: 8px;
}

.game-card .opponent { font-weight: 700; }
.game-card .score { color: var(--text-secondary); font-weight: 700; font-variant-numeric: tabular-nums; }
.game-card .date { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.game-card .team-tag { color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }

.game-card .entries { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.game-card .entry { font-size: 13px; }
.game-card .entry .name { font-weight: 700; }
.game-card .entry.Ellie .name { color: var(--series-ellie); }
.game-card .entry.Lilly .name { color: var(--series-lilly); }
.game-card .notes { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.empty-state {
  text-align: center;
  color: var(--text-muted);
  padding: 32px 16px;
  background: var(--surface-1);
  border: 1px dashed var(--border);
  border-radius: 12px;
  font-size: 14px;
}

.sync-note {
  font-size: 12px;
  color: var(--text-muted);
}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Goal Tracker</h1>
      <div class="sub">Ellie &amp; Lilly's soccer stats &mdash; synced from the family stats spreadsheet</div>
    </header>

    <div class="player-tabs">
      <button data-player="Both" class="active">Both</button>
      <button data-player="Ellie">Ellie</button>
      <button data-player="Lilly">Lilly</button>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="section">
      <div class="section-header">
        <h2>Summary</h2>
      </div>
      <div class="pivot-controls">
        <div class="control-group">
          <label class="group-label">Group rows by</label>
          <select id="groupBySelect">
            <option value="team">Team</option>
            <option value="teamSeason">Team + Season</option>
            <option value="season">Season</option>
            <option value="seasonYear">Full year</option>
          </select>
        </div>
        <div class="control-group">
          <label class="group-label">Season(s)</label>
          <div class="chip-row" id="seasonYearChips"></div>
        </div>
        <div class="control-group">
          <label class="group-label">Team(s)</label>
          <div class="chip-row" id="teamChips"></div>
        </div>
      </div>
      <div class="table-scroll">
        <table class="data-table" id="pivotTable"></table>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Games</h2>
        <button class="btn small" id="exportCsvBtn">Export CSV</button>
      </div>
      <div class="game-card-list" id="gamesList"></div>
    </div>
  </div>

  <script>
const PLAYERS = ["Ellie", "Lilly"];

let allGames = [];
let filters = {
  player: "Both",
  seasonYears: new Set(),
  teams: new Set(),
  groupBy: "team",
};

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// Maps a raw season label (e.g. "Fall 2025", "Winter 25-26", "Spring 2026")
// to the full soccer-year bucket it belongs to (e.g. "2025-26"). Winter spans
// a calendar-year boundary and Spring/Summer follow the Fall that started the
// same soccer year, so both anchor to the Fall's year.
function seasonYearOf(season) {
  if (!season) return "Unknown";
  const years = (season.match(/\d{2,4}/g) || []).map((y) =>
    y.length === 2 ? 2000 + parseInt(y, 10) : parseInt(y, 10)
  );
  if (years.length === 0) return season;
  const lower = season.toLowerCase();
  let anchor;
  if (lower.includes("winter")) anchor = Math.min(...years);
  else if (lower.includes("spring") || lower.includes("summer")) anchor = years[0] - 1;
  else anchor = years[0]; // Fall, or anything unrecognized
  return `${anchor}-${String((anchor + 1) % 100).padStart(2, "0")}`;
}

function uniqueGameKey(g) {
  return `${g.date}|${g.team}|${g.opponent}`;
}

// Sums goals/assists directly (each row belongs to one player), but dedupes
// by the underlying game for match-count and team goals for/against so a
// shared game (both girls played) isn't double-counted when combined.
function computeStats(entries) {
  const G = entries.reduce((s, e) => s + e.goals, 0);
  const A = entries.reduce((s, e) => s + e.assists, 0);
  const seen = new Map();
  for (const e of entries) {
    const k = uniqueGameKey(e);
    if (!seen.has(k)) seen.set(k, e);
  }
  const uniqueGames = [...seen.values()];
  const MP = uniqueGames.length;
  const GF = uniqueGames.reduce((s, e) => s + e.teamGoalsFor, 0);
  const GA = uniqueGames.reduce((s, e) => s + e.teamGoalsAgainst, 0);
  return {
    MP,
    G,
    A,
    GF,
    GA,
    goalsPerGame: MP ? G / MP : 0,
    assistsPerGame: MP ? A / MP : 0,
    pctOfGF: GF ? G / GF : 0,
  };
}

function gamesForPlayer(player) {
  return allGames.filter((g) => g.player === player);
}

function seasonYearFilteredGames(entries) {
  if (filters.seasonYears.size === 0) return entries;
  return entries.filter((g) => filters.seasonYears.has(seasonYearOf(g.season)));
}

function teamFilteredGames(entries) {
  if (filters.teams.size === 0) return entries;
  return entries.filter((g) => filters.teams.has(g.team));
}

function applyPivotFilters(entries) {
  return teamFilteredGames(seasonYearFilteredGames(entries));
}

function render() {
  renderStatCards();
  renderPivotControls();
  renderPivotTable();
  renderGames();
}

function renderStatCards() {
  const grid = document.getElementById("statGrid");
  const players = filters.player === "Both" ? PLAYERS : [filters.player];
  grid.innerHTML = players
    .map((p) => {
      const stats = computeStats(applyPivotFilters(gamesForPlayer(p)));
      const accentVar = p === "Ellie" ? "var(--series-ellie)" : "var(--series-lilly)";
      return `
        <div class="stat-card" style="--accent:${accentVar}">
          <div class="player-name">${p}</div>
          <div class="metrics">
            <div class="metric"><div class="value">${stats.G}</div><div class="label">Goals</div></div>
            <div class="metric"><div class="value">${stats.A}</div><div class="label">Assists</div></div>
            <div class="metric"><div class="value">${stats.MP}</div><div class="label">Games</div></div>
            <div class="metric"><div class="value">${stats.goalsPerGame.toFixed(2)}</div><div class="label">Goals / game</div></div>
            <div class="metric"><div class="value">${(stats.pctOfGF * 100).toFixed(0)}%</div><div class="label">% of team GF</div></div>
            <div class="metric"><div class="value">${stats.GF}-${stats.GA}</div><div class="label">Team GF-GA</div></div>
          </div>
        </div>`;
    })
    .join("");
}

function allSeasonYears() {
  return Array.from(new Set(allGames.map((g) => seasonYearOf(g.season)))).sort().reverse();
}

function teamsInSelectedSeasonYears() {
  const games = seasonYearFilteredGames(allGames);
  return Array.from(new Set(games.map((g) => g.team))).sort();
}

function renderPivotControls() {
  document.getElementById("groupBySelect").value = filters.groupBy;

  const seasonYearContainer = document.getElementById("seasonYearChips");
  seasonYearContainer.innerHTML = allSeasonYears()
    .map(
      (sy) =>
        `<span class="chip ${filters.seasonYears.has(sy) ? "active" : ""}" data-season-year="${escapeHtml(sy)}">${escapeHtml(sy)}</span>`
    )
    .join("");

  const teamContainer = document.getElementById("teamChips");
  teamContainer.innerHTML = teamsInSelectedSeasonYears()
    .map(
      (t) =>
        `<span class="chip ${filters.teams.has(t) ? "active" : ""}" data-team="${escapeHtml(t)}">${escapeHtml(t)}</span>`
    )
    .join("");
}

function groupKeyFns() {
  switch (filters.groupBy) {
    case "teamSeason":
      return { key: (g) => `${g.team}|${g.season}`, cols: (g) => [g.team, g.season] , headers: ["Team", "Season"] };
    case "season":
      return { key: (g) => g.season, cols: (g) => [g.season], headers: ["Season"] };
    case "seasonYear":
      return { key: (g) => seasonYearOf(g.season), cols: (g) => [seasonYearOf(g.season)], headers: ["Season"] };
    default:
      return { key: (g) => g.team, cols: (g) => [g.team], headers: ["Team"] };
  }
}

function renderPivotTable() {
  const table = document.getElementById("pivotTable");
  const players = filters.player === "Both" ? PLAYERS : [filters.player];
  const entries = applyPivotFilters(allGames.filter((g) => players.includes(g.player)));

  const { key, cols, headers } = groupKeyFns();
  const groups = new Map();
  for (const g of entries) {
    const k = key(g);
    if (!groups.has(k)) groups.set(k, { cols: cols(g), rows: [] });
    groups.get(k).rows.push(g);
  }

  const rows = Array.from(groups.values())
    .map((group) => ({ cols: group.cols, stats: computeStats(group.rows) }))
    .sort((a, b) => b.stats.MP - a.stats.MP);

  if (rows.length === 0) {
    table.innerHTML = "";
    table.insertAdjacentHTML(
      "afterend",
      ""
    );
    document.getElementById("pivotTable").outerHTML =
      '<div class="empty-state" id="pivotTable">No games match the current filters.</div>';
    return;
  }

  table.innerHTML = `
    <thead>
      <tr>
        ${headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("")}
        <th>MP</th><th>G</th><th>G/MP</th><th>% of GF</th><th>A</th><th>A/MP</th>
      </tr>
    </thead>
    <tbody>
      ${rows
        .map(
          (r) => `
        <tr>
          ${r.cols.map((c) => `<td>${escapeHtml(c)}</td>`).join("")}
          <td>${r.stats.MP}</td>
          <td>${r.stats.G}</td>
          <td>${r.stats.goalsPerGame.toFixed(2)}</td>
          <td>${(r.stats.pctOfGF * 100).toFixed(0)}%</td>
          <td>${r.stats.A}</td>
          <td>${r.stats.assistsPerGame.toFixed(2)}</td>
        </tr>`
        )
        .join("")}
    </tbody>`;
}

function renderGames() {
  const container = document.getElementById("gamesList");
  const players = filters.player === "Both" ? PLAYERS : [filters.player];
  const entries = applyPivotFilters(allGames.filter((g) => players.includes(g.player)));

  const byGame = new Map();
  for (const e of entries) {
    const k = uniqueGameKey(e);
    if (!byGame.has(k)) byGame.set(k, []);
    byGame.get(k).push(e);
  }

  const games = Array.from(byGame.values()).sort((a, b) => (a[0].date < b[0].date ? 1 : -1));

  if (games.length === 0) {
    container.innerHTML = `<div class="empty-state">No games logged yet for this filter.</div>`;
    return;
  }

  container.innerHTML = games
    .map((rows) => {
      const first = rows[0];
      const entryHtml = rows
        .map(
          (e) =>
            `<div class="entry ${e.player}"><span class="name">${e.player}</span> &mdash; ${e.goals}G ${e.assists}A</div>`
        )
        .join("");
      return `
        <div class="game-card">
          <div class="row1">
            <span class="opponent">vs ${escapeHtml(first.opponent)}</span>
            <span class="score">${first.teamGoalsFor}-${first.teamGoalsAgainst}</span>
            <span class="date">${fmtDate(first.date)}</span>
          </div>
          <div class="team-tag">${escapeHtml(first.team)} &middot; ${escapeHtml(first.season)}</div>
          <div class="entries">${entryHtml}</div>
        </div>`;
    })
    .join("");
}

function exportCsv() {
  const rows = [
    ["Date", "Season", "Team", "Opponent", "Player", "Goals", "Assists", "Team GF", "Team GA", "Notes"],
  ];
  allGames
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .forEach((g) => {
      rows.push([g.date, g.season, g.team, g.opponent, g.player, g.goals, g.assists, g.teamGoalsFor, g.teamGoalsAgainst, g.notes || ""]);
    });
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "soccer-stats-export.csv";
  a.click();
  URL.revokeObjectURL(url);
}

async function loadData() {
  const res = await fetch("data/games.json", { cache: "no-store" });
  const data = await res.json();
  allGames = data.games || [];

  // Default the season filter to the most recent full soccer year.
  const seasonYears = allSeasonYears();
  if (seasonYears.length > 0) filters.seasonYears.add(seasonYears[0]);
}

document.addEventListener("DOMContentLoaded", async () => {
  document.querySelectorAll(".player-tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      filters.player = btn.dataset.player;
      document.querySelectorAll(".player-tabs button").forEach((b) => b.classList.toggle("active", b === btn));
      render();
    });
  });

  document.getElementById("groupBySelect").addEventListener("change", (e) => {
    filters.groupBy = e.target.value;
    renderPivotTable();
  });

  document.getElementById("seasonYearChips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const sy = chip.dataset.seasonYear;
    if (filters.seasonYears.has(sy)) filters.seasonYears.delete(sy);
    else filters.seasonYears.add(sy);
    filters.teams.clear(); // team filter is scoped to season-year selection; reset it
    render();
  });

  document.getElementById("teamChips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const t = chip.dataset.team;
    if (filters.teams.has(t)) filters.teams.delete(t);
    else filters.teams.add(t);
    render();
  });

  document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);

  await loadData();
  render();
});
  </script>
</body>
</html>
