<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Corman Soccer Stats</title>
  <style>
:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --surface-2:      #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --border:         rgba(11, 11, 11, 0.10);
  --series-ellie:   #1f8f5f;
  --series-lilly:   #2a78d6;
  --series-both:    #6b6a64;
  --status-good:    #0ca30c;
  --status-critical:#d03b3b;
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255, 255, 255, 0.10);
    --series-ellie:   #3ecf94;
    --series-lilly:   #3987e5;
    --series-both:    #8a8980;
    --status-good:    #0ca30c;
    --status-critical:#e66767;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --surface-2:      #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --border:         rgba(255, 255, 255, 0.10);
  --series-ellie:   #e05a5a;
  --series-lilly:   #3987e5;
  --series-both:    #8a8980;
  --status-good:    #0ca30c;
  --status-critical:#e66767;
}

* { box-sizing: border-box; }

html {
  /* Disable iOS Safari's automatic text-size inflation in table columns,
     which recalculates on rotation and can balloon one column's font size
     independently of the rest of the page. */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html, body {
  overscroll-behavior: none;
}

body {
  margin: 0;
  background: var(--surface-2);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}

.app {
  max-width: 880px;
  margin: 0 auto;
  padding: 16px;
}

header.top {
  margin-bottom: 16px;
  padding-top: 8px;
}

header.top h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: -0.01em;
}

header.top .sub {
  font-size: 13px;
  color: var(--text-muted);
}

.summary-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.games-filters {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 8px;
  margin-bottom: 12px;
}

.games-filters #playerFilter,
.games-filters #seasonFilter {
  flex: 0 0 auto;
}

.games-filters #teamFilter {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


.section {
  margin-bottom: 24px;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}

.section-header h2 {
  font-size: 15px;
  margin: 0;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.btn {
  border: 1px solid var(--border);
  background: var(--surface-1);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}

.btn.small {
  padding: 4px 9px;
  font-size: 12px;
}

.btn.primary {
  background: var(--series-lilly);
  border-color: var(--series-lilly);
  color: #ffffff;
}
.btn.accent {
  background: color-mix(in srgb, var(--series-lilly) 14%, var(--surface-1));
  border-color: color-mix(in srgb, var(--series-lilly) 40%, transparent);
  color: var(--series-lilly);
}
.btn.accent:hover { background: color-mix(in srgb, var(--series-lilly) 22%, var(--surface-1)); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal-overlay.open { display: flex; }

/* Anchored to the top instead of vertically centered, so the box doesn't
   shift position as the viewport height changes while different fields
   are focused (e.g. the iOS keyboard opening/closing). */
.modal-overlay.align-top {
  align-items: flex-start;
  padding-top: 24px;
}

.modal-box {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  max-width: 320px;
  width: 100%;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  /* "contain" (the usual choice for a scrollable panel) still permits the
     box's own rubber-band bounce, only stopping it from chaining to the
     page behind it - "none" suppresses that local bounce entirely, which
     is what we want since this box rarely needs to scroll at all. */
  overscroll-behavior: none;
}
.modal-box h3 { margin: 0 0 10px; font-size: 16px; }
.modal-box.add-game-box { max-width: 360px; }

.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin: 0 0 4px;
}

.modal-input {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text-primary);
  margin-bottom: 8px;
}
.modal-input:disabled {
  background: var(--gridline);
  color: var(--text-muted);
  cursor: not-allowed;
  opacity: 0.7;
}

/* A native date input (for its calendar picker) sits invisibly on top of a
   plain text display showing the MM/DD/YY value - tapping anywhere in the
   box opens the native picker, but the visible text is always our own
   controlled format rather than whatever the OS locale would show. */
.modal-input.date-picker-field {
  position: relative;
  display: flex;
  align-items: center;
  padding: 0;
  overflow: hidden;
}
.date-picker-field span {
  padding: 8px 10px;
  width: 100%;
  pointer-events: none;
  white-space: nowrap;
}
.date-picker-field input[type="date"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: none;
  opacity: 0;
  cursor: pointer;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 10px;
  margin-bottom: 10px;
}
.form-grid .modal-input { margin-bottom: 0; }
.form-grid .player-radios { margin-bottom: 0; }

.player-radios {
  display: flex;
  gap: 16px;
  margin-bottom: 8px;
}
.player-radios label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.player-radios label.Ellie { color: var(--series-ellie); }
.player-radios label.Lilly { color: var(--series-lilly); }

.modal-error {
  color: var(--status-critical);
  font-size: 12px;
  margin-bottom: 8px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

select {
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  background: var(--surface-1);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  font-size: 13px;
}

table.data-table th, table.data-table td {
  padding: 9px 10px;
  text-align: right;
  border-bottom: 1px solid var(--gridline);
  white-space: nowrap;
}

table.data-table th:first-child, table.data-table td:first-child {
  text-align: left;
}

table.data-table th {
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-weight: 600;
}

table.data-table tr:last-child td { border-bottom: none; }

table.data-table tbody tr:hover { background: var(--surface-2); }

.table-scroll { overflow-x: auto; border-radius: 12px; }

table.summary-table tr.player-section td {
  text-align: left;
  font-weight: 700;
  border-left: 4px solid transparent;
  padding-top: 10px;
  padding-bottom: 10px;
}
table.summary-table tr.player-section.player-Ellie td { color: var(--series-ellie); border-left-color: var(--series-ellie); background: color-mix(in srgb, var(--series-ellie) 8%, var(--surface-1)); }
table.summary-table tr.player-section.player-Lilly td { color: var(--series-lilly); border-left-color: var(--series-lilly); background: color-mix(in srgb, var(--series-lilly) 8%, var(--surface-1)); }
table.summary-table tr.player-section.player-Both td { color: var(--series-both); border-left-color: var(--series-both); background: color-mix(in srgb, var(--series-both) 10%, var(--surface-1)); }

table.summary-table td.team-cell, table.summary-table th.team-cell {
  text-align: left;
}

table.summary-table td.team-cell.team-indent {
  padding-left: 24px;
}

table.summary-table tr.all-row td {
  font-weight: 700;
}

.player-name.player-Ellie { color: var(--series-ellie); }
.player-name.player-Lilly { color: var(--series-lilly); }

table.stacked-table th, table.stacked-table td {
  text-align: left;
  white-space: normal;
  vertical-align: top;
}

table.stacked-table th div {
  display: block;
  white-space: nowrap;
}
table.stacked-table th div:not(:first-child) {
  margin-top: 2px;
}

table.stacked-table td .player-name {
  font-weight: 700;
}
table.stacked-table td div:not(:first-child) {
  margin-top: 2px;
}

.empty-state {
  text-align: center;
  color: var(--text-muted);
  padding: 32px 16px;
  background: var(--surface-1);
  border: 1px dashed var(--border);
  border-radius: 12px;
  font-size: 14px;
}

table.data-table td.empty-cell {
  text-align: center;
  color: var(--text-muted);
  padding: 24px 16px;
  white-space: normal;
}

.sync-note {
  font-size: 12px;
  color: var(--text-muted);
}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Corman Soccer Stats</h1>
    </header>

    <div class="section">
      <div class="section-header">
        <h2>Summary</h2>
      </div>
      <div class="summary-controls">
        <select id="summarySeasonMode">
          <option value="current">Season: Current</option>
          <option value="all">Season: All</option>
        </select>
        <select id="summaryTeamDetail">
          <option value="show">Team Detail: Show</option>
          <option value="hide">Team Detail: Hide</option>
        </select>
      </div>
      <div class="table-scroll">
        <table class="data-table summary-table" id="summaryTable"></table>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Games</h2>
        <div class="header-actions">
          <a href="#" class="btn accent small" id="addGameLink">+ Add game</a>
          <a href="edit.html" class="btn accent small" id="editGamesLink">Edit</a>
          <a href="#" class="btn accent small" id="exportExcelBtn">Export</a>
        </div>
      </div>
      <div class="games-filters">
        <select id="playerFilter">
          <option value="Both">Both Players</option>
          <option value="Ellie">Ellie</option>
          <option value="Lilly">Lilly</option>
        </select>
        <select id="seasonFilter"><option value="">All seasons</option></select>
        <select id="teamFilter"><option value="">All Teams</option></select>
      </div>
      <div class="table-scroll">
        <table class="data-table stacked-table" id="gamesTable"></table>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="passwordModalOverlay">
    <div class="modal-box">
      <h3>Enter password</h3>
      <input type="password" class="modal-input" id="editPassword" autocomplete="off">
      <div class="modal-error" id="editPasswordError" hidden>Incorrect password.</div>
      <div class="modal-actions">
        <button class="btn" id="passwordCancelBtn">Cancel</button>
        <button class="btn primary" id="passwordUnlockBtn">Unlock</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay align-top" id="addGameModalOverlay">
    <div class="modal-box add-game-box">
      <h3>Add Game</h3>
      <div class="modal-error" id="addGameError" hidden></div>

      <div class="form-grid">
        <div>
          <label class="field-label">Player</label>
          <div class="player-radios">
            <label class="Ellie"><input type="radio" name="addGamePlayer" value="Ellie"> Ellie</label>
            <label class="Lilly"><input type="radio" name="addGamePlayer" value="Lilly"> Lilly</label>
          </div>
        </div>
        <div>
          <label class="field-label" for="addGameDate">Date</label>
          <div class="date-picker-field modal-input">
            <span id="addGameDateDisplay"></span>
            <input type="date" id="addGameDate" aria-label="Date">
          </div>
        </div>

        <div>
          <label class="field-label" for="addGameTeam">Team</label>
          <input type="text" class="modal-input" id="addGameTeam" list="addGameTeamSuggestions" placeholder="Team" autocomplete="off">
          <datalist id="addGameTeamSuggestions"></datalist>
        </div>
        <div>
          <label class="field-label" for="addGameOpponent">Opponent</label>
          <input type="text" class="modal-input" id="addGameOpponent" placeholder="Opponent" autocomplete="off">
        </div>

        <div>
          <label class="field-label" for="addGameGF">Team GF</label>
          <input type="number" min="0" class="modal-input" id="addGameGF" placeholder="0">
        </div>
        <div>
          <label class="field-label" for="addGameGA">Team GA</label>
          <input type="number" min="0" class="modal-input" id="addGameGA" placeholder="0">
        </div>

        <div>
          <label class="field-label" for="addGameGoals">Goals</label>
          <input type="number" min="0" class="modal-input" id="addGameGoals" placeholder="0">
        </div>
        <div>
          <label class="field-label" for="addGameAssists">Assists</label>
          <input type="number" min="0" class="modal-input" id="addGameAssists" placeholder="0">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn" id="addGameCancelBtn">Cancel</button>
        <button class="btn primary" id="addGameSaveBtn">Add game</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
const PLAYERS = ["Ellie", "Lilly"];

let allGames = [];
let filters = { player: "Both", season: "", team: "" }; // Games list filters.
let summaryFilters = { seasonMode: "current", teamDetail: "show" };

function fmtDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${m}/${d}/${y.slice(2)}`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// Seasons run August through July, so a game's season-year bucket (e.g.
// "2025-26") is inferred straight from its date.
function seasonYearOf(dateInput) {
  const d = new Date(dateInput);
  const anchor = d.getMonth() + 1 >= 8 ? d.getFullYear() : d.getFullYear() - 1;
  return `${anchor}-${String((anchor + 1) % 100).padStart(2, "0")}`;
}

// "Today" is always the current calendar date in US Eastern time, regardless
// of the device's own timezone - handles the EST/EDT switch automatically.
function todayEasternISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
}

function isFutureDate(isoDateStr) {
  return isoDateStr > todayEasternISO();
}

// A game only counts toward summary stats once it's actually been played:
// its date has arrived and a score was entered (team GF/GA aren't null).
// Lets a future game be logged as a placeholder - it still shows up as a
// team row - without affecting matches/goals/etc. until it's really played.
function isPlayedGame(g) {
  return !isFutureDate(g.date) && g.teamGoalsFor !== null && g.teamGoalsAgainst !== null;
}

function uniqueGameKey(g) {
  return `${g.date}|${g.team}|${g.opponent}`;
}

// Sums goals/assists directly (each row belongs to one player), but dedupes
// by the underlying game for match-count and team goals for/against so a
// shared game (both girls played) isn't double-counted when combined.
function computeStats(entries) {
  const G = entries.reduce((s, e) => s + e.goals, 0);
  const A = entries.reduce((s, e) => s + e.assists, 0);
  const seen = new Map();
  for (const e of entries) {
    const k = uniqueGameKey(e);
    if (!seen.has(k)) seen.set(k, e);
  }
  const uniqueGames = [...seen.values()];
  const MP = uniqueGames.length;
  const GF = uniqueGames.reduce((s, e) => s + e.teamGoalsFor, 0);
  const GA = uniqueGames.reduce((s, e) => s + e.teamGoalsAgainst, 0);
  return {
    MP,
    G,
    A,
    GF,
    GA,
    goalsPerGame: MP ? G / MP : 0,
    assistsPerGame: MP ? A / MP : 0,
    pctOfGF: GF ? G / GF : 0,
  };
}

function allSeasonYears() {
  return Array.from(new Set(allGames.map((g) => seasonYearOf(g.date)))).sort().reverse();
}

// The Summary table only ever shows this full soccer-year and later (older
// history is still browsable in the Games list below). Rolls over in August,
// so a year from now this becomes 2026, keeping the table on the current and
// prior full year automatically.
const EARLIEST_SUMMARY_YEAR = 2025;

function currentSeasonYear() {
  return seasonYearOf(todayEasternISO());
}

function render() {
  renderSummaryTable();
  renderGames();
}

// Builds the fixed Player > Season(full year) > Team hierarchy: each player's
// most recent full season-year first, an "All" subtotal per season-year, then
// each team they played on that year (A-Z). "Both" only gets "All" rows,
// combining the girls without double-counting shared games (see computeStats).
function buildSummaryRows() {
  let seasonYears;
  if (summaryFilters.seasonMode === "current") {
    seasonYears = [currentSeasonYear()];
  } else {
    const dataSeasonYears = allSeasonYears().filter(
      (sy) => parseInt(sy, 10) >= EARLIEST_SUMMARY_YEAR
    );
    seasonYears = Array.from(new Set([currentSeasonYear(), ...dataSeasonYears]))
      .sort()
      .reverse();
  }

  const rows = [];
  for (const player of ["Ellie", "Lilly", "Both"]) {
    const playerGames = player === "Both" ? allGames : allGames.filter((g) => g.player === player);

    for (const sy of seasonYears) {
      const syGames = playerGames.filter((g) => seasonYearOf(g.date) === sy);
      if (syGames.length === 0 && sy !== currentSeasonYear()) continue;

      const syPlayedGames = syGames.filter(isPlayedGame);
      rows.push({ player, seasonYear: sy, team: "All", stats: computeStats(syPlayedGames), isAllRow: true });

      if (player === "Both" || summaryFilters.teamDetail === "hide") continue;

      // Teams come from every game logged this season (including future
      // placeholders), so a team shows up even before its first played game -
      // but its stats only ever come from games that actually count.
      const teams = Array.from(new Set(syGames.map((g) => g.team))).sort();
      for (const team of teams) {
        const teamGames = syPlayedGames.filter((g) => g.team === team);
        rows.push({ player, seasonYear: sy, team, stats: computeStats(teamGames), isAllRow: false });
      }
    }
  }
  return rows;
}

// Team, M, GF-GA, G, G/M, GF%, A, A/M
const SUMMARY_COLUMN_COUNT = 8;

function renderSummaryTable() {
  const table = document.getElementById("summaryTable");
  const rows = buildSummaryRows();

  const bodyRows = rows
    .map((r, i) => {
      const prev = rows[i - 1];
      const isNewPlayer = !prev || prev.player !== r.player;

      const playerSectionRow = isNewPlayer
        ? `<tr class="player-section player-${r.player}"><td colspan="${SUMMARY_COLUMN_COUNT}">${escapeHtml(r.player)}</td></tr>`
        : "";

      // The season's own row doubles as its "all teams" total (bold values
      // next to the season year); team rows beneath it are indented.
      const teamLabel = r.isAllRow ? r.seasonYear : r.team;
      const teamCellClass = r.isAllRow ? "team-cell" : "team-cell team-indent";

      return `
        ${playerSectionRow}
        <tr class="player-${r.player} ${r.isAllRow ? "all-row" : ""}">
          <td class="${teamCellClass}">${escapeHtml(teamLabel)}</td>
          <td>${r.stats.MP}</td>
          <td>${r.stats.GF}-${r.stats.GA}</td>
          <td>${r.stats.G}</td>
          <td>${r.stats.goalsPerGame.toFixed(2)}</td>
          <td>${(r.stats.pctOfGF * 100).toFixed(0)}%</td>
          <td>${r.stats.A}</td>
          <td>${r.stats.assistsPerGame.toFixed(2)}</td>
        </tr>`;
    })
    .join("");

  table.innerHTML = `
    <thead>
      <tr>
        <th class="team-cell"></th>
        <th title="Matches">M</th>
        <th title="Team goals for - goals against">GF-GA</th>
        <th title="Goals">G</th>
        <th title="Goals per match">G/M</th>
        <th title="Percent of team's total goals for">GF%</th>
        <th title="Assists">A</th>
        <th title="Assists per match">A/M</th>
      </tr>
    </thead>
    <tbody>${bodyRows}</tbody>`;
}

function outcomeLetter(gf, ga) {
  if (gf > ga) return "W";
  if (gf < ga) return "L";
  return "T";
}

// "1 G, 2 A" - omits either part when it's zero, and is blank when both are zero.
function formatGoalsAssists(goals, assists) {
  const parts = [];
  if (goals > 0) parts.push(`${goals} G`);
  if (assists > 0) parts.push(`${assists} A`);
  return parts.join(", ");
}

function populateGameFilters() {
  const seasonSelect = document.getElementById("seasonFilter");
  const teamSelect = document.getElementById("teamFilter");

  const seasonYears = Array.from(new Set([currentSeasonYear(), ...allGames.map((g) => seasonYearOf(g.date))]))
    .sort()
    .reverse();
  seasonSelect.innerHTML =
    `<option value="">All Seasons</option>` +
    seasonYears.map((sy) => `<option value="${escapeHtml(sy)}">${escapeHtml(sy)}</option>`).join("");

  const teams = Array.from(new Set(allGames.map((g) => g.team))).sort();
  teamSelect.innerHTML =
    `<option value="">All Teams</option>` +
    teams.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
}

function renderGames() {
  const table = document.getElementById("gamesTable");
  const players = filters.player === "Both" ? PLAYERS : [filters.player];

  const rows = allGames
    .filter((g) => players.includes(g.player))
    .filter((g) => !filters.season || seasonYearOf(g.date) === filters.season)
    .filter((g) => !filters.team || g.team === filters.team)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  const bodyHtml =
    rows.length === 0
      ? `<tr><td class="empty-cell" colspan="3">No games logged yet for this filter.</td></tr>`
      : rows
          .map(
            (g) => `
        <tr>
          <td>
            <div class="player-name player-${g.player}">${escapeHtml(g.player)}</div>
            <div>${fmtDate(g.date)}</div>
          </td>
          <td>
            <div>${escapeHtml(g.team)}</div>
            <div>v. ${escapeHtml(g.opponent)}</div>
          </td>
          <td>
            <div>${g.teamGoalsFor !== null && g.teamGoalsAgainst !== null ? `${g.teamGoalsFor}-${g.teamGoalsAgainst} (${outcomeLetter(g.teamGoalsFor, g.teamGoalsAgainst)})` : "Scheduled"}</div>
            <div>${formatGoalsAssists(g.goals, g.assists)}</div>
          </td>
        </tr>`
          )
          .join("");

  table.innerHTML = `
    <thead>
      <tr>
        <th><div>Player</div><div>Date</div></th>
        <th><div>Team</div><div>Opponent</div></th>
        <th><div>Team GF-GA</div><div>Player G, A</div></th>
      </tr>
    </thead>
    <tbody>${bodyHtml}</tbody>`;
}

async function loadData() {
  const res = await fetch("data/games.json", { cache: "no-store" });
  const data = await res.json();
  allGames = data.games || [];
}

// Not real security - just keeps casual visitors from poking at edit.html.
// See edit.html for the same check (it must also gate direct visits there).
const EDIT_PASSWORD = "soccer118";
const EDIT_UNLOCK_KEY = "soccerEditUnlocked";

// Vercel serverless function that holds the GitHub token server-side and
// proxies the save. See api/README.md for setup.
const SAVE_ENDPOINT = "https://soccer-stats-dashboard.vercel.app/api/save-games";

// Tracks which action the password gate should resume once unlocked, since
// both "Edit" (navigate away) and "+ Add game" (open a modal in place)
// share the same gate.
let pendingUnlockAction = null;

function openPasswordModal() {
  document.getElementById("editPassword").value = "";
  document.getElementById("editPasswordError").hidden = true;
  document.getElementById("passwordModalOverlay").classList.add("open");
  document.getElementById("editPassword").focus();
}

function closePasswordModal() {
  document.getElementById("passwordModalOverlay").classList.remove("open");
}

function tryUnlockEdit() {
  if (document.getElementById("editPassword").value === EDIT_PASSWORD) {
    sessionStorage.setItem(EDIT_UNLOCK_KEY, "true");
    closePasswordModal();
    if (pendingUnlockAction === "addGame") {
      openAddGameModal();
    } else {
      window.location.href = "edit.html";
    }
  } else {
    document.getElementById("editPasswordError").hidden = false;
  }
}

// -- add game modal --

const ADD_GAME_TEAM_WINDOW_DAYS = 30;

function refreshAddGameTeamSuggestions() {
  // Normalize "today" to a date-only value first so the window is a clean
  // +/-30 whole-day range, unaffected by what time of day it happens to be
  // (game dates always parse as midnight UTC, so comparing against "now"
  // directly would skew the boundary by up to a day).
  const todayOnly = new Date(todayEasternISO());
  const lowerCutoff = new Date(todayOnly);
  lowerCutoff.setDate(lowerCutoff.getDate() - ADD_GAME_TEAM_WINDOW_DAYS);
  const upperCutoff = new Date(todayOnly);
  upperCutoff.setDate(upperCutoff.getDate() + ADD_GAME_TEAM_WINDOW_DAYS);
  const teams = new Set();
  allGames.forEach((g) => {
    const d = new Date(g.date);
    if (d >= lowerCutoff && d <= upperCutoff) teams.add(g.team);
  });
  document.getElementById("addGameTeamSuggestions").innerHTML = Array.from(teams)
    .sort()
    .map((t) => `<option value="${escapeHtml(t)}">`)
    .join("");
}

// Future games haven't been played yet, so their score fields are greyed
// out and blocked from entry until the date arrives.
function updateAddGameScoreFieldsDisabled() {
  const date = document.getElementById("addGameDate").value; // native date input - always ISO
  const future = date ? isFutureDate(date) : false;
  ["addGameGF", "addGameGA", "addGameGoals", "addGameAssists"].forEach((id) => {
    document.getElementById(id).disabled = future;
  });
}

function updateAddGameDateDisplay() {
  const date = document.getElementById("addGameDate").value;
  document.getElementById("addGameDateDisplay").textContent = date ? fmtDate(date) : "";
}

// iOS Safari auto-scrolls the page to keep a focused input visible above the
// keyboard, which shifts position:fixed elements even though they shouldn't
// move - the fix is to freeze the background page (nothing left to scroll)
// for as long as the modal is open.
let addGameScrollY = 0;

function lockBodyScroll() {
  addGameScrollY = window.scrollY;
  document.body.style.position = "fixed";
  document.body.style.top = `-${addGameScrollY}px`;
  document.body.style.left = "0";
  document.body.style.right = "0";
}

function unlockBodyScroll() {
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.right = "";
  window.scrollTo(0, addGameScrollY);
}

// Older iOS versions can still show a rubber-band "bounce" flash of
// whatever's behind a fixed-position element on a touch drag, even with
// the body frozen and overscroll-behavior set - block touchmove outside
// the modal box entirely while it's open, but let the box's own content
// still scroll normally if it's taller than the viewport.
function blockBackgroundTouchMove(e) {
  const box = e.target.closest(".modal-box");
  if (!box) {
    e.preventDefault();
    return;
  }
  // Only let the box's own touch-scroll through if it actually has
  // overflow content to scroll - otherwise there's nothing legitimate to
  // preserve, and blocking it too avoids any residual local bounce beyond
  // what overscroll-behavior alone might suppress.
  if (box.scrollHeight <= box.clientHeight) e.preventDefault();
}

// The actual trigger for the bounce/shift reported so far isn't scroll
// physics at all - it's iOS Safari's own "scroll the focused input into
// view" behavior, which fires the instant a field gains focus, independent
// of whether the page can otherwise scroll. Overscroll-behavior and the
// touchmove guard can't stop that. Immediately re-focusing with
// {preventScroll: true} tells Safari not to scroll for this focus at all.
let suppressingFocusScroll = false;

function suppressFocusScroll(e) {
  if (suppressingFocusScroll) return;
  const el = e.target;
  if (!el || typeof el.focus !== "function" || typeof el.blur !== "function") return;
  suppressingFocusScroll = true;
  el.blur();
  el.focus({ preventScroll: true });
  suppressingFocusScroll = false;
}

function openAddGameModal() {
  document.getElementById("addGameError").hidden = true;
  document.getElementById("addGameDate").value = todayEasternISO();
  updateAddGameDateDisplay();
  document.getElementById("addGameTeam").value = "";
  document.getElementById("addGameOpponent").value = "";
  document.getElementById("addGameGF").value = "";
  document.getElementById("addGameGA").value = "";
  document.getElementById("addGameGoals").value = "";
  document.getElementById("addGameAssists").value = "";
  document.querySelectorAll('input[name="addGamePlayer"]').forEach((r) => { r.checked = false; });
  updateAddGameScoreFieldsDisabled();
  refreshAddGameTeamSuggestions();
  lockBodyScroll();
  document.getElementById("addGameModalOverlay").classList.add("open");
  document.addEventListener("touchmove", blockBackgroundTouchMove, { passive: false });
  document.getElementById("addGameModalOverlay").addEventListener("focusin", suppressFocusScroll);
}

function closeAddGameModal() {
  document.getElementById("addGameModalOverlay").classList.remove("open");
  unlockBodyScroll();
  document.removeEventListener("touchmove", blockBackgroundTouchMove);
  document.getElementById("addGameModalOverlay").removeEventListener("focusin", suppressFocusScroll);
}

// Blank means "no score entered yet" and is preserved as null rather than
// coerced to 0, so it can be excluded from summary stats - distinct from an
// actual 0-0 result.
function parseOptionalScore(input) {
  const raw = input.value.trim();
  return raw === "" ? null : Number(raw) || 0;
}

async function saveNewGame() {
  const errorEl = document.getElementById("addGameError");
  errorEl.hidden = true;

  const date = document.getElementById("addGameDate").value; // native date input - always ISO
  const team = document.getElementById("addGameTeam").value.trim();
  const opponent = document.getElementById("addGameOpponent").value.trim();
  const playerInput = document.querySelector('input[name="addGamePlayer"]:checked');
  const player = playerInput ? playerInput.value : "";

  if (!date || !team || !opponent || !player) {
    errorEl.textContent = "Date, Team, Opponent, and Player are required.";
    errorEl.hidden = false;
    return;
  }

  const newGame = {
    date,
    team,
    opponent,
    player,
    goals: Number(document.getElementById("addGameGoals").value) || 0,
    assists: Number(document.getElementById("addGameAssists").value) || 0,
    teamGoalsFor: parseOptionalScore(document.getElementById("addGameGF")),
    teamGoalsAgainst: parseOptionalScore(document.getElementById("addGameGA")),
  };

  const saveBtn = document.getElementById("addGameSaveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving…";

  try {
    const resp = await fetch(SAVE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: EDIT_PASSWORD, games: [...allGames, newGame] }),
    });
    const result = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(result.error || `Save failed (${resp.status}).`);

    allGames.push(newGame);
    populateGameFilters();
    render();
    closeAddGameModal();
  } catch (err) {
    errorEl.textContent = "Couldn't save: " + err.message;
    errorEl.hidden = false;
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Add game";
  }
}

function exportToExcel() {
  const rows = allGames
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((g) => ({
      Date: g.date,
      Season: seasonYearOf(g.date),
      Team: g.team,
      Opponent: g.opponent,
      Player: g.player,
      Goals: g.goals,
      Assists: g.assists,
      "Team GF": g.teamGoalsFor,
      "Team GA": g.teamGoalsAgainst,
      Notes: g.notes || "",
    }));
  const worksheet = XLSX.utils.json_to_sheet(rows);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Games");
  XLSX.writeFile(workbook, "soccer-stats-export.xlsx");
}

document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("summarySeasonMode").addEventListener("change", (e) => {
    summaryFilters.seasonMode = e.target.value;
    renderSummaryTable();
  });

  document.getElementById("summaryTeamDetail").addEventListener("change", (e) => {
    summaryFilters.teamDetail = e.target.value;
    renderSummaryTable();
  });

  document.getElementById("playerFilter").addEventListener("change", (e) => {
    filters.player = e.target.value;
    renderGames();
  });

  document.getElementById("seasonFilter").addEventListener("change", (e) => {
    filters.season = e.target.value;
    renderGames();
  });

  document.getElementById("teamFilter").addEventListener("change", (e) => {
    filters.team = e.target.value;
    renderGames();
  });

  document.getElementById("editGamesLink").addEventListener("click", (e) => {
    e.preventDefault();
    pendingUnlockAction = "edit";
    if (sessionStorage.getItem(EDIT_UNLOCK_KEY) === "true") {
      window.location.href = "edit.html";
      return;
    }
    openPasswordModal();
  });

  document.getElementById("addGameLink").addEventListener("click", (e) => {
    e.preventDefault();
    pendingUnlockAction = "addGame";
    if (sessionStorage.getItem(EDIT_UNLOCK_KEY) === "true") {
      openAddGameModal();
      return;
    }
    openPasswordModal();
  });

  document.getElementById("passwordCancelBtn").addEventListener("click", closePasswordModal);
  document.getElementById("passwordUnlockBtn").addEventListener("click", tryUnlockEdit);
  document.getElementById("editPassword").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlockEdit();
  });

  document.getElementById("addGameCancelBtn").addEventListener("click", closeAddGameModal);
  document.getElementById("addGameSaveBtn").addEventListener("click", saveNewGame);
  document.getElementById("addGameDate").addEventListener("input", () => {
    updateAddGameDateDisplay();
    updateAddGameScoreFieldsDisabled();
  });

  document.getElementById("exportExcelBtn").addEventListener("click", (e) => {
    e.preventDefault();
    exportToExcel();
  });

  await loadData();
  populateGameFilters();
  render();
});
  </script>
</body>
