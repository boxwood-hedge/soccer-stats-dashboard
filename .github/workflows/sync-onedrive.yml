name: Sync OneDrive Excel data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync script
        env:
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
        run: python3 scripts/sync_onedrive.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/onedrive-export.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync OneDrive Excel data"
            git push
          fi
